<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌊 山陽四國．手帳風情侶自駕遊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Noto+Sans+TC:wght@400;500;700&display=swap">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <style>
        body {
            font-family: 'Kosugi Maru', 'Noto Sans TC', sans-serif;
            background-color: #F7F4EB;
            background-image: radial-gradient(#E5DFD3 1.5px, transparent 1.5px);
            background-size: 20px 20px;
        }
        .diary-card {
            background: #FFFFFF;
            border: 2px solid #E6DFD1;
            border-radius: 24px;
            box-shadow: 5px 5px 0px #E2DCD0;
        }
        /* 更新為使用者指定的藍色色號 #33CCFF */
        .diary-btn-blue {
            background-color: #33CCFF;
            color: white;
            border-radius: 16px;
            box-shadow: 3px 3px 0px #0099CC;
        }
        .diary-btn-amber {
            background-color: #D9822B;
            color: white;
            border-radius: 14px;
            box-shadow: 2px 2px 0px #915114;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .timeline-line::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 19px;
            width: 3px;
            background: repeating-linear-gradient(to bottom, #C8D6AF, #C8D6AF 4px, transparent 4px, transparent 8px);
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-28 text-gray-800">

    <header class="bg-[#688B9A] text-white px-5 pt-6 pb-5 rounded-b-[32px] shadow-md border-b-4 border-[#4E6E7B] sticky top-0 z-40">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-xl font-bold tracking-wider flex items-center gap-1">
                    <span>🗺️</span> 山陽四國手帳日記
                </h1>
                <p class="text-xs text-blue-100 mt-1 font-mono">2026.06.13 - 06.21 🌴 9Days</p>
            </div>
            <div class="bg-[#EBF3F5] text-[#335C67] text-[11px] px-3 py-1 rounded-full font-bold border border-[#B2CCD4]">
                🚗 Nissan March
            </div>
        </div>
        
        <div class="flex gap-2.5 overflow-x-auto hide-scrollbar py-1" id="dateSelector"></div>
    </header>

    <main class="px-4 py-4 flex-grow" id="appBody"></main>

    <div id="detailModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 border-2 border-[#E6DFD1] shadow-2xl relative max-h-[85vh] overflow-y-auto hide-scrollbar">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-circle-xmark text-xl"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <nav class="fixed bottom-4 left-4 right-4 max-w-sm mx-auto bg-white/95 backdrop-blur-md border-2 border-[#E6DFD1] shadow-xl z-40 rounded-2xl p-2 flex justify-around items-center">
        <button onclick="changeTab('schedule')" id="nav-schedule" class="flex flex-col items-center text-[#33CCFF] font-bold active:scale-95 transition-all">
            <i class="fa-solid fa-compass text-lg mb-0.5"></i>
            <span class="text-[10px] font-bold">行程</span>
        </button>
        <button onclick="changeTab('bookings')" id="nav-bookings" class="flex flex-col items-center text-gray-400 active:scale-95 transition-all">
            <i class="fa-solid fa-ticket text-lg mb-0.5"></i>
            <span class="text-[10px] font-bold">預訂</span>
        </button>
        <button onclick="changeTab('expense')" id="nav-expense" class="flex flex-col items-center text-gray-400 active:scale-95 transition-all">
            <i class="fa-solid fa-calculator text-lg mb-0.5"></i>
            <span class="text-[10px] font-bold">記帳</span>
        </button>
        <button onclick="changeTab('planning')" id="nav-planning" class="flex flex-col items-center text-gray-400 active:scale-95 transition-all">
            <i class="fa-solid fa-heart-circle-check text-lg mb-0.5"></i>
            <span class="text-[10px] font-bold">準備</span>
        </button>
        <button onclick="changeTab('members')" id="nav-members" class="flex flex-col items-center text-gray-400 active:scale-95 transition-all">
            <i class="fa-solid fa-user-group text-lg mb-0.5"></i>
            <span class="text-[10px] font-bold">成員</span>
        </button>
    </nav>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION & INITIALIZATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        let db; let storage;
        try {
            if (firebaseConfig.apiKey !== "YOUR_FIREBASE_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                firebase.firestore().enablePersistence().catch(err => console.log("離線模式限制:", err.code));
                db = firebase.firestore();
                storage = firebase.storage();
            }
        } catch(e) { console.log("Firebase 尚未填寫，自動切換至 LocalStorage 離線運行"); }

        // ==========================================
        // 2. STATE MANAGEMENT & DATA
        // ==========================================
        let activeTab = 'schedule';
        let selectedDay = 1;

        let membersList = JSON.parse(localStorage.getItem('m_list')) ||
