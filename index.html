<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-28 text-gray-800">

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION & INITIALIZATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        let db; let storage;
        try {
            if (firebaseConfig.apiKey !== "YOUR_FIREBASE_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                firebase.firestore().enablePersistence().catch(err => console.log("離線模式限制:", err.code));
                db = firebase.firestore();
                storage = firebase.storage();
            }
        } catch(e) { console.log("Firebase 尚未填寫，自動切換至 LocalStorage 離線運行"); }

        // ==========================================
        // 2. STATE MANAGEMENT & DATA
        // ==========================================
        let activeTab = 'schedule';
        let selectedDay = 1;

        // 成員名冊大修正: George & Charlotte
        let membersList = JSON.parse(localStorage.getItem('m_list')) || [
            { id: 'm1', name: 'George (車手/吸菸)', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80' },
            { id: 'm2', name: 'Charlotte (總監/購物)', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=120&q=80' }
        ];

        // 離線景點照片庫
        let spotPhotos = JSON.parse(localStorage.getItem('spot_photos')) || {};

        let checklistData = JSON.parse(localStorage.getItem('c_list')) || [
            { id: 1, type: 'todo', text: '線上申辦國際駕照與日文譯本', done: true },
            { id: 2, type: 'baggage', text: 'George 必備打火機與備用菸草', done: false },
            { id: 3, type: 'shopping', text: '倉敷美觀限定紙膠帶與文具', done: false }
        ];

        let expenseLedger = JSON.parse(localStorage.getItem('e_ledger')) || [
            { id: 'ex1', text: 'D1 高松商店街宵夜骨付鳥', amountJpy: 4000, payer: 'George (車手/吸菸)', split: '雙人均分' },
            { id: 'ex2', text: 'D2 大步危峽觀光船雙人票', amountJpy: 3000, payer: 'Charlotte (總監/購物)', split: '雙人均分' },
            { id: 'ex3', text: 'D3 松山城雙人空中吊椅套票', amountJpy: 2080, payer: 'George (車手/吸菸)', split: '雙人均分' }
        ];

        // 包含完整備註與地圖代碼的 9 日手帳大數據
        const mainItinerary = {
            1: { date: "6/13 (六)", weather: "☀️ 晴 26°C", title: "台北 ➔ 高松機場 ➔ 市區", focus: "抵達、機場取車、高松商店街晚餐與初試身手。", smoking: "商店街內全面禁菸，但特定居酒屋內部或步行 3 分鐘的超商門口有專屬吸菸區。", items: [
                { id: "1_1", time: "18:05", type: "transport", spot: "高松機場辦理入境", desc: "班機準時降落，出關流程快速。", note: "記得先準備好 Visit Japan Web 的 QR Code 加快速度。", map: "https://maps.google.com/?q=Takamatsu+Airport" },
                { id: "1_2", time: "19:00", type: "transport", spot: "NISSAN 租車櫃台取車", desc: "至櫃台辦理手續，購買 9 日 SEP，檢查 March 車況。", note: "租車合約書與保險條款要收妥。機場門外設有指定喫煙所，取車前 George 可先補一根。", map: "https://maps.google.com/?q=NISSAN+Rent+A+Car+Takamatsu+Airport" },
                { id: "1_3", time: "20:10", type: "hotel", spot: "Hostel JAQ takamatsu 入住", desc: "地址：香川県高松市片原町1-1", note: "辦理入住並放好大件行李。今日油資預估 300 日圓。", map: "https://maps.google.com/?q=Hostel+JAQ+takamatsu" },
                { id: "1_4", time: "20:30", type: "food", spot: "兵庫町/片原町商店街", desc: "步行至高松最長的商店街享用宵夜。", note: "推薦烏龍麵名店或在地名物骨付鳥（烤帶骨雞腿）。", map: "https://maps.google.com/?q=Takamatsu+Central+Shopping+Street" }
            ]},
            2: { date: "6/14 (日)", weather: "⛅ 多雲 24°C", title: "高松城 ➔ 大步危秘境 ➔ 松山夕陽", focus: "四國三大水城之一、德島秘境遊船、傍晚拉車至愛媛。", smoking: "大步危觀光船售票處旁有極大的戶外吸菸區。松山全日空飯店館內設有舒適密閉吸菸室。", items: [
                { id: "2_1", time: "08:30", type: "scenic", spot: "高松城 (玉藻公園)", desc: "散步前往欣賞罕見的護城河引進海水的「水城」。", note: "可以在天守台遺跡俯瞰瀨戶內海與琴電列車掠過。", map: "https://maps.google.com/?q=Takamatsu+Castle" },
                { id: "2_2", time: "11:30", type: "scenic", spot: "大步危峽谷觀光遊覽船", desc: "搭乘觀光船（航程 30 分鐘），沿途欣賞急流與壯麗奇岩。", note: "雙人門票 3,000 日圓。下船後順路開車經小步危拍照，中午吃祖谷蕎麥麵。", map: "https://maps.google.com/?q=Oboke+Gorge+Pleasure+Boat" },
                { id: "2_3", time: "16:30", type: "hotel", spot: "松山全日空皇冠假日飯店", desc: "地址：愛媛県松山市一番町3丁目2-1", note: "橫跨四國拉車約 2.5 小時，走高速公路因有 SEP 免過路費。館內設有密閉吸菸室。", map: "https://maps.google.com/?q=ANA+Crowne+Plaza+Matsuyama" },
                { id: "2_4", time: "17:30", type: "food", spot: "道後溫泉周邊散步", desc: "晚餐在大街道享用愛媛鯛魚飯，晚上看少爺機關鐘。", note: "可以在周邊泡個溫馨的足湯，感受百年名湯的氛圍。", map: "https://maps.google.com/?q=Dogo+Onsen+Main+Building" }
            ]},
            3: { date: "6/15 (一)", weather: "🌧️ 局部雨 22°C", title: "松山城 ➔ 萬翠莊 ➔ 大街道購物日", focus: "體驗松山城單人空中吊椅、大街道與銀天街強大購物行程。", smoking: "松山城山頂廣場指定位置設有吸菸區；大街道商店街內部分柏青哥店或指定居酒屋有吸菸室。", items: [
                { id: "3_1", time: "09:00", type: "scenic", spot: "松山城空中吊椅", desc: "搭乘超酷的「單人無安全帶吊椅」登上松山城天守。", note: "套票雙人 2,080 日圓。可以俯瞰整個松山市區與瀨戶內海。", map: "https://maps.google.com/?q=Matsuyama+Castle+Ropeway" },
                { id: "3_2", time: "11:30", type: "scenic", spot: "萬翠莊", desc: "山腳下參觀法國文藝復興風格的浪漫洋樓。", note: "大正時期由久松定謨伯爵建造的別邸，非常適合拍照。", map: "https://maps.google.com/?q=Bansuisou" },
                { id: "3_3", time: "14:00", type: "shopping", spot: "大街道與銀天街商店街", desc: "全天瘋狂購物日，並朝聖【扭蛋之森】大扭特扭。", note: "中午吃經典鍋燒烏龍麵，晚餐吃瀨戶內海海鮮居酒屋。", map: "https://maps.google.com/?q=Matsuyama+Okaido+Shopping+Street" }
            ]},
            4: { date: "6/16 (二)", weather: "☀️ 晴 25°C", title: "島波海道跳島自駕 ➔ 廣島", focus: "世界級自行車聖地公路自駕、絕美瀨戶內海觀景台、拉車到廣島。", smoking: "龜老山展望台停車場旁設有吸菸區。島波海道沿途的「道の駅」都有極棒的戶外喫煙所。", items: [
                { id: "4_1", time: "09:30", type: "scenic", spot: "龜老山展望公園", desc: "大島最具代表性景點，隈研吾設計的無機調木質全景觀景台。", note: "能 360 度俯瞰壯觀的來島海峽大橋，美到令人摒息。", map: "https://maps.google.com/?q=Kirosan+Observatory+Park" },
                { id: "4_2", time: "11:00", type: "transport", spot: "島波海道自駕跳島", desc: "一路開車跨越伯方島、大三島、生口島，中午在島上吃檸檬拉麵。", note: "跨海橋樑費 SEP 已全包，中途需加油預估 2,000 日圓。", map: "https://maps.google.com/?q=Shimanami+Kaido" },
                { id: "4_3", type: "hotel", spot: "廣島全日空皇冠假日飯店", desc: "地址：廣島県廣島市中区中町7-20", note: "下海道後走山陽道拉車約 1.5 小時至廣島市區辦理入住。", map: "https://maps.google.com/?q=ANA+Crowne+Plaza+Hiroshima" },
                { id: "4_4", time: "16:30", type: "shopping", spot: "本通商店街 & Minamoa廣島", desc: "逛街，朝聖新開幕商場的【AKOMEYA TOKYO】精緻生活雜貨。", note: "Charlotte 的重點大店！晚餐順便尋找廣島在地小吃。", map: "https://maps.google.com/?q=Hiroshima+Hondori+Shopping+Street" }
            ]},
            5: { date: "6/17 (三)", weather: "☀️ 晴 27°C", title: "廣島城 ➔ 原爆圓頂 ➔ 宮島嚴島神社", focus: "歷史巡禮、下午前往宮島目睹世界遺產海上大鳥居滿潮絕景。", smoking: "宮島全島嚴格禁菸，但在「宮島棧橋出口右側」和「主要商店街後方巷弄」設有指定密閉吸菸室。", items: [
                { id: "5_1", time: "09:00", type: "scenic", spot: "原子彈爆炸圓頂屋 & 廣島城", desc: "漫步平和紀念公園，見證歷史傷痕與重生歷史。", note: "廣島城又稱鯉城，非常雄偉好拍。", map: "https://maps.google.com/?q=Atomic+Bomb+Dome" },
                { id: "5_2", time: "12:15", type: "transport", spot: "搭乘 JR 宮島渡輪", desc: "開車至宮島口停放（停車費 1,000 日圓），搭船前往宮島。", note: "渡輪費雙人來回與宮島訪問稅約 600 日圓。", map: "https://maps.google.com/?q=Miyajimaguchi+Ferry+Terminal" },
                { id: "5_3", time: "13:00", type: "scenic", spot: "嚴島神社海上大鳥居", desc: "完美目睹大鳥居完全矗立在蔚藍海水中的神聖滿潮絕景。", note: "在表參道吃現烤肥美大牡蠣與紅葉饅頭。", map: "https://maps.google.com/?q=Itsukushima+Shrine" },
                { id: "5_4", time: "19:00", type: "food", spot: "廣島燒名店【鐵太】或【電光石火】", desc: "回廣島市區，安排正宗大份量廣島燒晚餐。", note: "看著師傅在面前的大鐵板上層層堆疊高麗菜、五花肉與炒麵，視覺味覺雙重享受。", map: "https://maps.google.com/?q=Chinchikurin+Hiroshima" }
            ]},
            6: { date: "6/18 (四)", weather: "⛅ 多雲 23°C", title: "尾道山城 ➔ 宿：鞆之浦海景", focus: "依山傍海的文青小鎮、尋找貓咪蹤跡、入住崖上的波妞原型港町。", smoking: "尾道纜車站旁有吸菸區。鞆之浦為歷史木造建築保護區，戶外全面禁菸，但部分的開闊停車場設有集菸桶。", items: [
                { id: "6_1", time: "10:00", type: "scenic", spot: "千光寺公園 & 貓之細道", desc: "搭纜車上山俯瞰尾道水道，隨後沿石階小路漫步下山尋找貓咪。", note: "山腳下記得來一碗經典的背脂「尾道拉麵」當午餐。", map: "https://maps.google.com/?q=Senkoji+Park" },
                { id: "6_2", time: "14:00", type: "scenic", spot: "阿伏兎觀音", desc: "造訪奇蹟般建在斷崖絕壁上的朱紅色觀音寺廟。", note: "雙人門票 400 日圓，海水擊打礁石的畫面極度震撼。", map: "https://maps.google.com/?q=Abuto+Kannon" },
                { id: "6_3", time: "16:00", type: "hotel", spot: "鞆之浦 Airbnb 包棟老屋", desc: "辦理入住，傍晚在夕陽下的港泰常夜燈散步。", note: "這裏是宮崎駿「崖上的波妞」靈感發源地，極具江戶港町風情，晚餐吃鯛魚料理。", map: "https://maps.google.com/?q=Tomonoura+Joyato+Lighthouse" }
            ]},
            7: { date: "6/19 (五)", weather: "☀️ 晴 26°C", title: "鞆之浦 ➔ 倉敷美觀 ➔ 岡山購物", focus: "經典對潮樓窗景、白壁柳樹的倉敷水鄉、入住岡山站前便利飯店、AEON 瘋狂採購。", smoking: "倉敷美觀地區中央公廁旁、以及大型收費停車場周邊有指定吸菸區。APA飯店內有專用吸菸室。", items: [

        function initApp() {

        function renderDateSelector() {
            const container = document.getElementById('dateSelector');
            container.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const dayObj = mainItinerary[i];
                const isSelected = selectedDay === i && activeTab === 'schedule';
                const card = document.createElement('button');
                card.className = `flex-shrink-0 w-[64px] py-2 rounded-2xl flex flex-col items-center justify-center border-2 transition-all active:scale-95 ${
                    isSelected 
                    ? 'bg-[#EAD9C9] border-[#C4A484] text-[#5C4033] font-bold shadow-sm' 
                    : 'bg-white/80 border-[#E6DFD1] text-gray-600'
                }`;
                card.onclick = () => {
                    selectedDay = i; activeTab = 'schedule';
                    renderDateSelector(); renderSchedule();
                };
                card.innerHTML = `
                    <span class="text-[10px] uppercase tracking-tighter opacity-80">Day ${i}</span>
                    <span class="text-xs font-bold mt-0.5">${dayObj.date.split(' ')[0]}</span>
                `;
                container.appendChild(card);
            }
        }

        function changeTab(tabName) {
            activeTab = tabName;
            const tabs = ['schedule', 'bookings', 'expense', 'planning', 'members'];
            tabs.forEach(t => {
                const navBtn = document.getElementById(`nav-${t}`);
                navBtn.className = t === tabName 
                    ? "flex flex-col items-center text-[#4A7C59] font-bold active:scale-95 transition-all"
                    : "flex flex-col items-center text-gray-400 active:scale-95 transition-all";
            });
            renderDateSelector();
            
            if (tabName === 'schedule') renderSchedule();
            else if (tabName === 'bookings') renderBookings();
            else if (tabName === 'expense') renderExpense();
            else if (tabName === 'planning') renderPlanning();
            else if (tabName === 'members') renderMembers();
        }

                        <i class="fa-solid fa-camera mr-1"></i>上傳手帳照
                        <input type="file" accept="image/*" class="hidden" onchange="compressAndSaveSpotPhoto(event, '${itemId}')">

                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function compressAndSaveSpotPhoto(event, itemId) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = function (e) {
                const img = new Image(); img.src = e.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    const maxW = 400; const scale = maxW / img.width;
                    canvas.width = maxW; canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressedUrl = canvas.toDataURL('image/jpeg', 0.7);
                    
                    spotPhotos[itemId] = compressedUrl;
                    localStorage.setItem('spot_photos', JSON.stringify(spotPhotos));
                    
                    if (storage) {
                        storage.ref(`spots/${itemId}.jpg`).putString(compressedUrl, 'data_url').then(() => console.log('Firebase 雲端相簿已同步'));
                    }
                    closeDetailModal(); renderSchedule();
                };
            };
        }

                </div>

                <div class="diary-card p-4 bg-white mb-4">
                    <h3 class="text-xs font-bold text-gray-400 mb-3">🖊️ 紀錄一筆花費吧</h3>
                    <div class="space-y-2 text-xs">
                        <input type="text" id="expText" placeholder="支出項目 (如：吃拉麵)" class="w-full border border-[#E6DFD1] rounded-xl px-3 py-2 focus:outline-none">
                        <div class="flex gap-2">
                            <input type="number" inputmode="numeric" id="expJpy" placeholder="日幣金額 (¥)" class="w-1/2 border border-[#E6DFD1] rounded-xl px-3 py-2 font-mono text-center focus:outline-none">
                            <select id="expPayer" class="w-1/2 border border-[#E6DFD1] rounded-xl px-2 py-2 bg-white focus:outline-none">
                                ${membersList.map(m => `<option>${m.name}</option>`).join('')}
                            </select>
                        </div>
                        <button onclick="addExpense()" class="w-full diary-btn-blue py-2 text-xs font-bold shadow-sm active:scale-95 transition-all">手帳記帳確認</button>
                    </div>
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-gray-400 px-1">📋 支出歷史明細紙條</h3>
                    <div class="space-y-2 max-h-[25vh] overflow-y-auto hide-scrollbar">${listHtml || '<p class="text-center text-xs text-gray-400 py-4">目前尚無手帳記帳紀錄</p>'}</div>
                </div>
            `;
        }

        function addExpense() {
            const text = document.getElementById('expText').value.trim();
            const amountJpy = parseInt(document.getElementById('expJpy').value);
            const payer = document.getElementById('expPayer').value;
            if (!text || isNaN(amountJpy)) return;

            const newExp = { id: 'ex_' + Date.now(), text, amountJpy, payer, split: '雙人均分' };
            expenseLedger.push(newExp);
            localStorage.setItem('e_ledger', JSON.stringify(expenseLedger));
            if (db) db.collection("expenses").doc(newExp.id).set(newExp).catch(() => {});
            renderExpense();
        }

        function deleteExpense(index) {
            const item = expenseLedger[index];
            expenseLedger.splice(index, 1);
            localStorage.setItem('e_ledger', JSON.stringify(expenseLedger));
            if (db && item.id) db.collection("expenses").doc(item.id).delete().catch(() => {});
            renderExpense();
        }

        // --- MODULE 4: PLANNING (準備) ---
        function renderPlanning() {
            const container = document.getElementById('appBody');
            let htmlTodo = '', htmlBaggage = '', htmlShopping = '';
            checklistData.forEach(item => {
                const li = `
                    <label class="flex items-center justify-between p-2 bg-[#FAF9F6] border border-[#E6DFD1] rounded-xl cursor-pointer hover:bg-gray-50 transition-all">
                        <span class="text-xs text-gray-700 ${item.done ? 'line-through text-gray-400' : ''}">${item.text}</span>
                        <input type="checkbox" ${item.done ? 'checked' : ''} onclick="toggleCheck(${item.id})" class="w-4 h-4 rounded text-[#4A7C59] focus:ring-0">
                    </label>
                `;
                if (item.type === 'todo') htmlTodo += li;
                else if (item.type === 'baggage') htmlBaggage += li;
                else if (item.type === 'shopping') htmlShopping += li;
            });

            container.innerHTML = `
                <div class="diary-card p-4 bg-white space-y-4">
                    <div><h3 class="text-xs font-bold text-[#4A7C59] mb-2">📋 行前待辦事項 (Todo)</h3><div class="space-y-1.5">${htmlTodo}</div></div>
                    <div><h3 class="text-xs font-bold text-[#688B9A] mb-2">🎒 行李打包清單 (Baggage)</h3><div class="space-y-1.5">${htmlBaggage}</div></div>
                    <div><h3 class="text-xs font-bold text-[#D9822B] mb-2">🛍️ 預定瘋狂購物清單 (Shopping)</h3><div class="space-y-1.5">${htmlShopping}</div></div>
                </div>
            `;
        }

        function toggleCheck(id) {
            checklistData = checklistData.map(item => item.id === id ? { ...item, done: !item.done } : item);
            localStorage.setItem('c_list', JSON.stringify(checklistData));
            renderPlanning();
        }

        // --- MODULE 5: MEMBERS (成員) ---
        function renderMembers() {
            const container = document.getElementById('appBody');
            let membersHtml = '';
            membersList.forEach((m, idx) => {
                membersHtml += `
                    <div class="flex items-center justify-between bg-[#FDFDFD] p-3 rounded-xl border-2 border-[#E6DFD1]">
                        <div class="flex items-center gap-3">
                            <img id="avatar-img-${idx}" src="${m.avatar}" class="w-11 h-11 rounded-full object-cover border-2 border-[#688B9A] shadow-inner">
                            <div>
                                <p class="text-xs font-bold text-gray-800">${m.name}</p>
                                <p class="text-[9px] text-gray-400 font-mono">SWEET_COUPLE_0${idx+1}</p>
                            </div>
                        </div>
                        <label class="diary-btn-blue text-[10px] px-3 py-1 font-bold shadow-sm cursor-pointer active:scale-95 transition-all">
                            更新大頭貼 <input type="file" accept="image/*" class="hidden" onchange="compressAndUploadAvatar(event, ${idx})">
                        </label>
                    </div>
                `;
            });
            container.innerHTML = `
                <div class="diary-card p-4 bg-white space-y-4">
                    <h3 class="text-xs font-bold text-gray-400 border-b border-gray-100 pb-1.5">💕 情侶甜蜜手帳成員名冊</h3>
                    <div class="space-y-3">${membersHtml}</div>
                </div>
            `;
        }

        function compressAndUploadAvatar(event, idx) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = function (e) {
                const img = new Image(); img.src = e.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    const maxW = 120; const scale = maxW / img.width;
                    canvas.width = maxW; canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressedUrl = canvas.toDataURL('image/jpeg', 0.7);
                    
                    membersList[idx].avatar = compressedUrl;
                    localStorage.setItem('m_list', JSON.stringify(membersList));
                    document.getElementById(`avatar-img-${idx}`).src = compressedUrl;
                    if (storage) storage.ref(`avatars/user_${idx}.jpg`).putString(compressedUrl, 'data_url');
                };
            };
        }

        initApp();
    </script>
</body>
</html>
