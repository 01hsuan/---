        function initApp() {
            renderDateSelector();

        function renderDateSelector() {
            const container = document.getElementById('dateSelector');
            container.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const dayObj = mainItinerary[i];
                const isSelected = selectedDay === i && activeTab === 'schedule';
                const card = document.createElement('button');
                card.className = `flex-shrink-0 w-[64px] py-2 rounded-2xl flex flex-col items-center justify-center border-2 transition-all active:scale-95 ${
                    isSelected 
                    ? 'bg-[#EAD9C9] border-[#C4A484] text-[#5C4033] font-bold shadow-sm' 
                    : 'bg-white/80 border-[#E6DFD1] text-gray-600'
                }`;
                card.onclick = () => {
                    selectedDay = i;
                    activeTab = 'schedule';
                    renderDateSelector();
                    renderSchedule();
                };
                card.innerHTML = `
                    <span class="text-[10px] uppercase tracking-tighter opacity-80">Day ${i}</span>
                    <span class="text-xs font-bold mt-0.5">${dayObj.date.split(' ')[0]}</span>
                `;
                container.appendChild(card);
            }

        // --- MODULE 3: EXPENSE (記帳) ---
        function renderExpense() {

                        <input type="text" id="expText" placeholder="支出項目 (如：買藥妝、吃拉麵)" class="w-full border border-[#E6DFD1] rounded-xl px-3 py-2 focus:outline-none">
                        <div class="flex gap-2">
                            <input type="number" inputmode="numeric" id="expJpy" placeholder="日幣金額 (¥)" class="w-1/2 border border-[#E6DFD1] rounded-xl px-3 py-2 font-mono text-center focus:outline-none">

                        </div>
                        <button onclick="addExpense()" class="w-full diary-btn-blue py-2 text-xs font-bold shadow-sm active:scale-95 transition-all">手帳記帳確認</button>
                    </div>
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-gray-400 px-1">📋 支出歷史明細紙條</h3>
                    <div class="space-y-2 max-h-[25vh] overflow-y-auto hide-scrollbar">
                        ${listHtml || '<p class="text-center text-xs text-gray-400 py-4">目前尚無手帳記帳紀錄</p>'}

        }

        function addExpense() {
            const text = document.getElementById('expText').value.trim();
            const amountJpy = parseInt(document.getElementById('expJpy').value);
            const payer = document.getElementById('expPayer').value;
            if (!text || isNaN(amountJpy)) return;

            const newExp = { id: 'ex_' + Date.now(), text, amountJpy, payer, split: '雙人均分' };
            expenseLedger.push(newExp);
            localStorage.setItem('e_ledger', JSON.stringify(expenseLedger));

            // Firebase 即時數據備份同步 (若有設定)
            if (db) {
                db.collection("expenses").doc(newExp.id).set(newExp).catch(e => console.log("快取儲存中，等候在線同步"));
            }

            renderExpense();
        }

        function deleteExpense(index) {
            const item = expenseLedger[index];
            expenseLedger.splice(index, 1);
            localStorage.setItem('e_ledger', JSON.stringify(expenseLedger));
            
            if (db && item.id) {
                db.collection("expenses").doc(item.id).delete().catch(e => console.log("快取刪除中"));
            }
            renderExpense();
        }

        // 前端進行圖片壓縮與 Firebase Storage 上傳處理
        function compressAndUploadAvatar(event, idx) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function () {
                    // Canvas 高端像素前端壓縮
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxW = 150;
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;
                    
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    
                    // 更新網頁視圖快取
                    membersList[idx].avatar = compressedDataUrl;
                    localStorage.setItem('m_list', JSON.stringify(membersList));
                    document.getElementById(`avatar-img-${idx}`).src = compressedDataUrl;

                    // 若 Firebase 開通則上傳至 Storage
                    if (storage) {
                        const storageRef = storage.ref(`avatars/user_${idx}.jpg`);
                        storageRef.putString(compressedDataUrl, 'data_url').then(snapshot => {
                            console.log('Firebase Storage 上傳成功！');
                        });
                    }
                };
            };
        }

        // 啟動全網頁手帳系統
        initApp();
    </script>
